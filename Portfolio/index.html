<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old Portfolio</title>
    <link rel="stylesheet" href="/assets/styles/style.css" />
    <style>
      body {
        text-align: center;
        /* font-size: var(--8xl); */
        font-weight: bolder;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .sorry {
        color: #0006ef;
      }

      .one {
        background-color: red;
        width: 5px;
        height: 100px;
        opacity: 0.2;
        margin-left: 20px;
      }

      .glow {
        position: relative;
        width: 300px;
        height: 200px;
        border-radius: 20px;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background-color: var(--bgcolor);
      }

      .glow::before {
        position: absolute;
        content: "";
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        display: flex;
        align-items: center;
        background: conic-gradient(
          from 0deg at 50% 50%,
          red 0%,
          red 20%,
          transparent 35%,
          transparent 45%,
          blue 50%,
          blue 70%,
          transparent 85%,
          transparent 95%,
          red 100%
        );
        animation: glow 10s linear infinite;
        z-index: 0;
        border-radius: inherit;
      }

      .glow::before {
        background: red; /* fallback solid color */
      }

      @supports (background: conic-gradient(red, blue)) {
        .glow::before {
          background: conic-gradient(
            from 0deg at 50% 50%,
            red 0%,
            red 20%,
            transparent 35%,
            transparent 45%,
            blue 50%,
            blue 70%,
            transparent 85%,
            transparent 95%,
            red 100%
          );
        }
      }

      .glow::after {
        position: absolute;
        content: "";
        background-color: var(--bgcolor);
        inset: 2px;
        border-radius: inherit;
        z-index: 1;
      }

      .content {
        padding: 5px;
        z-index: 2;
        font-size: var(--sm);
      }

      a {
        display: inline-block;
        margin-top: 40px;
        background-color: #0006ef;
        width: auto;
        padding: 2px 15px;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        font-size: var(--xs);
        cursor: pointer;
      }

      @keyframes glow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* xs */
      @media (min-width: 475px) {
        .content {
          font-size: var(--base);
        }
        .glow {
          position: relative;
          width: 300px;
          height: 200px;
        }
      }

      /* sm */
      @media (min-width: 640px) {
        .content {
          font-size: var(--lg);
        }
        .glow {
          position: relative;
          width: 400px;
          height: 300px;
        }

        .glow::before {
          width: 200%;
          height: 200%;
        }
      }

      /* md */
      @media (min-width: 768px) {
        .content {
          font-size: var(--xl);
        }
        .glow {
          position: relative;
          width: 500px;
          height: 400px;
        }

        .glow::before {
          width: 200%;
          height: 200%;
        }
      }

      /* lg */
      @media (min-width: 1024px) {
        .content {
          font-size: var(--2xl);
        }
        .glow {
          position: relative;
          width: 600px;
          height: 500px;
        }

        .glow::before {
          width: 200%;
          height: 200%;
        }
      }

      /* xl */
      @media (min-width: 1280px) {
        .content {
          font-size: var(--3xl);
        }
        .glow {
          position: relative;
          width: 700px;
          height: 600px;
        }

        .glow::before {
          width: 200%;
          height: 200%;
        }
      }

      /* 2xl */
      @media (min-width: 1536px) {
        .content {
          font-size: var(--4xl);
        }
        .glow {
          position: relative;
          width: 800px;
          height: 700px;
        }

        .glow::before {
          width: 200%;
          height: 200%;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow">
      <div class="content">
        <p class="sorry">Sorry, This page is down for maintenance.</p>
        <p class="back">We will be back up soon!</p>

        <a href="/index.html#portfolio">Go back</a>
      </div>
    </div>
  </body>
</html>
