<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Monitor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
      }

      .container {
        max-width: 500px;
        margin: 30px auto;
        background: white;
        padding: 20px;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select,
      textarea,
      button {
        width: 95%;
        margin-top: 5px;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      select {
        width: 99%;
      }

      button {
        width: 100%;
        margin-top: 15px;
        background: #0078d4;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
      }

      button:hover {
        background: #005bb5;
      }
      .btns {
        display: flex;
        gap: 20px;
      }
      #close-report-btn {
        background-color: red;
        width: 20%;
      }

      .report-modal {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        height: 70%;
        max-width: 700px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
        padding: 0 20px 20px 20px;
        display: none;
      }

      .report-modal.hidden {
        display: none;
      }

      .report-modal:not(.hidden) {
        display: block;
      }

      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .report-content {
        margin-top: 15px;
        max-height: 430px;
        overflow-y: auto;
      }

      .report-content div {
        padding: 10px;
        margin-bottom: 10px;
        margin-right: 20px;
        border-radius: 6px;
      }

      .report-content div:nth-child(odd) {
        border: 1px solid #005bb5;
        border-left: 6px solid #005bb5;
      }
      .report-content div:nth-child(even) {
        border: 1px solid red;
        border-left: 6px solid red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Spending Monitor</h1>
      <div class="form">
        <label for="account-type">Account Type</label>
        <select id="account-type">
          <option value="Mobile Money">Mobile Money</option>
          <option value="Bank Account">Bank Account</option>
          <option value="Physical Cash">Physical Cash</option>
        </select>

        <label for="deposit-amount" id="deposit-label"
          >Amount To Deposit:</label
        >
        <input
          type="number"
          id="deposit-amount"
          placeholder="Enter deposit amount"
        />

        <label for="withdraw-amount" id="withdraw-label"
          >Amount To Withdraw:</label
        >
        <input
          type="number"
          id="withdraw-amount"
          placeholder="Enter withdrawal amount"
        />

        <label for="message">Message (Optional):</label>
        <textarea id="message" placeholder="Enter a message"></textarea>

        <button id="submit-btn">Submit</button>
        <div class="btns">
          <button id="check">Check balance</button>
          <button id="view-report-btn">View Report</button>
        </div>
      </div>

      <div class="report-modal hidden">
        <div class="report-header">
          <h2>Report</h2>
          <button id="close-report-btn">Close</button>
        </div>
        <div class="report-content"></div>
      </div>
    </div>
    <script>
      const mobileAccount = JSON.parse(localStorage.getItem("mobilemoney")) || {
        Deposited: 0,
        Withdrawn: 0,
        Date: "N/A",
        Balance: 0,
        message: "No message provided!",
      };

      const bankAccount = JSON.parse(localStorage.getItem("bankaccount")) || {
        Deposited: 0,
        Withdrawn: 0,
        Date: "N/A",
        Balance: 0,
        message: "No message provided!",
      };

      const physicalCash = JSON.parse(localStorage.getItem("physicalcash")) || {
        Deposited: 0,
        Withdrawn: 0,
        Date: "N/A",
        Balance: 0,
        message: "No message provided!",
      };

      const accountTypes = {
        "Mobile Money": mobileAccount,
        "Bank Account": bankAccount,
        "Physical Cash": physicalCash,
      };

      const accountType = document.getElementById("account-type");
      const depositAmount = document.getElementById("deposit-amount");
      const withdrawAmount = document.getElementById("withdraw-amount");
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submit-btn");
      const viewReportBtn = document.getElementById("view-report-btn");
      const closeReportBtn = document.getElementById("close-report-btn");
      const reportModal = document.querySelector(".report-modal");
      const reportContent = document.querySelector(".report-content");

      // Update labels dynamically based on the selected account type
      accountType.addEventListener("change", () => {
        const selected = accountType.value;
        if (selected === "Physical Cash") {
          document.getElementById("deposit-label").innerText =
            "Amount Available:";
          document.getElementById("withdraw-label").innerText = "Amount Spent:";
        } else {
          document.getElementById("deposit-label").innerText =
            "Amount To Deposit:";
          document.getElementById("withdraw-label").innerText =
            "Amount To Withdraw:";
        }
      });

      let mobileHTML = localStorage.getItem("Mobile") || "";
      let bankHTML = localStorage.getItem("Bank") || "";
      let cashHTML = localStorage.getItem("Cash") || "";

      // Submit transaction
      submitBtn.addEventListener("click", () => {
        const selectedAccount = accountType.value;
        const account = accountTypes[selectedAccount];

        const deposit = parseFloat(depositAmount.value) || 0;
        const withdraw = parseFloat(withdrawAmount.value) || 0;

        // Prevent withdrawing more than the deposit
        if (withdraw > account.Balance || withdraw < 0) {
          alert("Withdrawal Unsuccessful. Enter valid amount");
          return;
        }

        account.Deposited = deposit || 0; // Ensure deposit value does not repeat
        account.Withdrawn = withdraw || 0;
        account.Balance += deposit - withdraw;
        account.message = message.value.trim() || "No message provided!";
        account.Date = new Date().toLocaleString();

        updateReport(account, selectedAccount);
        updateLocalStorage(selectedAccount, account);

        depositAmount.value = "";
        withdrawAmount.value = "";
        message.value = "";
        alert("Transaction recorded successfully!");
      });

      // Update report content
      function updateReport(account, selectedAccount) {
        const reportHTML = `
          <div class="report-entry">
            <p><strong>Account:</strong> ${selectedAccount}</p>
            <p><strong>${
              selectedAccount === "Physical Cash"
                ? "Amount Available"
                : "Deposited"
            }:</strong> ₵${account.Deposited.toFixed(2)}</p>
            <p><strong>${
              selectedAccount === "Physical Cash" ? "Amount Spent" : "Withdrawn"
            }:</strong> ₵${account.Withdrawn.toFixed(2)}</p>
            <p><strong>Balance:</strong> ₵${account.Balance.toFixed(2)}</p>
            <p><strong>Message:</strong> ${account.message}</p>
            <p><strong>Date:</strong> ${account.Date}</p>
          </div>
        `;

        if (selectedAccount === "Mobile Money") {
          mobileHTML += reportHTML;
          localStorage.setItem("Mobile", mobileHTML);
        } else if (selectedAccount === "Bank Account") {
          bankHTML += reportHTML;
          localStorage.setItem("Bank", bankHTML);
        } else if (selectedAccount === "Physical Cash") {
          cashHTML += reportHTML;
          localStorage.setItem("Cash", cashHTML);
        }
      }

      // Update localStorage
      function updateLocalStorage(selectedAccount, account) {
        const storageKey = selectedAccount.toLowerCase().replace(" ", "");
        localStorage.setItem(storageKey, JSON.stringify(account));
      }

      // View report
      viewReportBtn.addEventListener("click", () => {
        const selectedAccount = accountType.value;

        // Show the modal
        reportModal.classList.remove("hidden");

        // Populate report content with stored HTML
        if (selectedAccount === "Mobile Money") {
          reportContent.innerHTML =
            localStorage.getItem("Mobile") || "No transactions available.";
        } else if (selectedAccount === "Bank Account") {
          reportContent.innerHTML =
            localStorage.getItem("Bank") || "No transactions available.";
        } else if (selectedAccount === "Physical Cash") {
          reportContent.innerHTML =
            localStorage.getItem("Cash") || "No transactions available.";
        }
      });

      // Close report modal
      closeReportBtn.addEventListener("click", () => {
        reportModal.classList.add("hidden");
      });
    </script>
  </body>
</html>
